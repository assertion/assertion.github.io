# ---------------- #
#   Main Configs   #
# ---------------- #
baseurl: ""
url: https://code-echo.pages.dev
date_format: "ordinal"
title: 代码的回声
author: ""
paginate: 9

# ---------------- #
#   RSS / Email    #
# ---------------- #
subscribe_rss: /atom.xml
email:

# ---------------- #
#      Jekyll      #
# ---------------- #
markdown: redcarpet
redcarpet: 
    extensions: ["no_intra_emphasis", "fenced_code_blocks", "autolink", "tables", "with_toc_data", "strikethrough"]
pygments: true
permalink: /:year/:month/:day/:title
gems:
    - jekyll-sitemap
    - jekyll-gist
    - jekyll-paginate
