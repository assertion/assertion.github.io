# ---------------- #
#   Main Configs   #
# ---------------- #
baseurl: ""
# Canonical/primary host for both GitHub Pages and Cloudflare production.
# Absolute canonical/hreflang/og/JSON-LD/feed/sitemap URLs are derived from this.
# Local override: _config_local.yml. Cloudflare preview should leave this as-is
# so preview deploys do not get indexed as a second origin.
url: https://code-echo.pages.dev
timezone: Asia/Shanghai
date_format: "ordinal"
title: 代码的回声
author: ""
paginate: 15

# Optional webmaster verification (rendered in <head> only when non-empty)
google_site_verification: ""
bing_site_verification: ""

# ---------------- #
#   RSS / Email    #
# ---------------- #
subscribe_rss: /feed.xml
email:

# ---------------- #
#      Jekyll      #
# ---------------- #
markdown: redcarpet
redcarpet: 
    extensions: ["no_intra_emphasis", "fenced_code_blocks", "autolink", "tables", "with_toc_data", "strikethrough"]
pygments: true
permalink: /:year/:month/:day/:title
include:
    - _redirects
    - _headers
exclude:
    - functions
    - _scripts
    - wrangler.toml
    - node_modules
    - Gemfile
    - Gemfile.lock
    - README.md
    - README.textile
    - LICENSE
    - AGENTS.md
    - .travis.yml
    - _config_cf.yml
gems:
    - jekyll-sitemap
    - jekyll-gist
    - jekyll-paginate