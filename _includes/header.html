{% assign page_lang = page.lang | default: 'zh' %}
{% if page_lang == 'zh' %}{% assign html_lang = 'zh-CN' %}{% else %}{% assign html_lang = 'en' %}{% endif %}
<!DOCTYPE html>
<html lang="{{ html_lang }}" data-page-lang="{{ page_lang }}">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        {% include seo.html %}
        <link rel="stylesheet" href="{{ site.baseurl }}/css/site.css" type="text/css" />
        <link rel="stylesheet" href="{{ site.baseurl }}/css/default.css" type="text/css" />
        <link rel="stylesheet" href="{{ site.baseurl }}/css/syntax.css" type="text/css" />
        {% if page.body_class contains 'page-home' %}
        <link rel="stylesheet" href="{{ site.baseurl }}/css/home.css" type="text/css" />
        {% endif %}
        {% if page.layout == 'post' %}
        <link rel="stylesheet" href="{{ site.baseurl }}/css/post.css" type="text/css" />
        {% endif %}
        <link rel="shortcut icon" href="{{ site.baseurl }}/favicon.ico" type="image/x-icon" />
        <script>
        (function(){
            var lang = localStorage.getItem('site-lang') || 'zh';
            document.documentElement.setAttribute('data-lang', lang);
        })();
        </script>
</head>
    <body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
